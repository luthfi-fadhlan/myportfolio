<p class="experience-status">
    <a href="{% url 'main:update_education' education.id %}"
       class="button button-neutral"
       aria-label="Perbarui {{ education.institution }}"
       title="Perbarui pendidikan">
        Perbarui
    </a>
    <button type="button"
            class="button button-danger"
            popovertarget="delete-education-{{ education.id }}"
            aria-label="Hapus {{ education.institution }}"
            title="Hapus pendidikan">
        Hapus Pendidikan
    </button>
</p>
<div id="delete-education-{{ education.id }}"
     class="experience-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-education-title-{{ education.id }}">
    <button type="button"
            class="experience-delete-modal__backdrop"
            popovertarget="delete-education-{{ education.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="experience-delete-modal__content">
        <button type="button"
                class="experience-delete-modal__close"
                popovertarget="delete-education-{{ education.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-education-institution-{{ education.id }}">Hapus Pendidikan?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ education.institution }}</strong>?
        </p>
        <div class="experience-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-education-{{ education.id }}"
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_education' education.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
